[changelog]
header = """
# Changelog

All notable changes to `copanion` will be recorded here.
"""
body = """
{% if version -%}
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | upper_first }}
{% for commit in commits -%}
- {{ commit.message | upper_first }}
{% endfor %}
{% if not loop.last %}

{% endif -%}
{% endfor %}"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false

[[git.commit_parsers]]
message = "^feat"
group = "features"

[[git.commit_parsers]]
message = "^fix"
group = "fixes"

[[git.commit_parsers]]
message = "^refactor"
group = "refactors"

[[git.commit_parsers]]
message = "^docs"
group = "docs"

[[git.commit_parsers]]
message = "^ci"
group = "ci"

[[git.commit_parsers]]
message = "^chore"
group = "chores"

[[git.commit_parsers]]
message = "^test"
group = "tests"

[[git.commit_parsers]]
message = "^build"
group = "build"

[[git.commit_parsers]]
message = "^perf"
group = "performance"

[[git.commit_parsers]]
message = "^style"
group = "style"

[[git.commit_parsers]]
message = ".*"
group = "other"
