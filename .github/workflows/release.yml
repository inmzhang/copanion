name: Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Release bump to prepare"
        required: true
        type: choice
        options:
          - bump-patch
          - bump-minor
          - bump-major
  pull_request:
    types:
      - closed
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release-pr:
    name: Create Release PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Get current version
        id: current
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Calculate new version
        id: new
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.current.outputs.version }}"
          case "${{ github.event.inputs.action }}" in
            bump-major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            bump-minor)
              minor=$((minor + 1))
              patch=0
              ;;
            bump-patch)
              patch=$((patch + 1))
              ;;
          esac
          NEW_VERSION="${major}.${minor}.${patch}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumping ${{ steps.current.outputs.version }} -> $NEW_VERSION"

      - name: Update Cargo.toml version
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.new.outputs.version }}"/' Cargo.toml

      - name: Update Cargo.lock
        run: cargo generate-lockfile

      - name: Generate changelog
        run: |
          PREV_TAG="v${{ steps.current.outputs.version }}"
          NEXT_TAG="v${{ steps.new.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$PREV_TAG" >/dev/null; then
            git-cliff "$PREV_TAG..HEAD" --tag "$NEXT_TAG" --output CHANGELOG.md
          else
            git-cliff --tag "$NEXT_TAG" --output CHANGELOG.md
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG.md")
          path.write_text(path.read_text(encoding="utf-8").rstrip("\n") + "\n", encoding="utf-8")
          PY

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(release): prepare v${{ steps.new.outputs.version }}"
          branch: release/v${{ steps.new.outputs.version }}
          title: "release: v${{ steps.new.outputs.version }}"
          body: |
            Prepares v${{ steps.new.outputs.version }} from ${{ steps.current.outputs.version }}.

            Included updates:
            - bump `Cargo.toml` to v${{ steps.new.outputs.version }}
            - regenerate `Cargo.lock`
            - regenerate `CHANGELOG.md` with `git-cliff`

            Once this PR is merged, the release workflow will:
            - publish v${{ steps.new.outputs.version }} to crates.io
            - create and push tag `v${{ steps.new.outputs.version }}`
            - create the GitHub release

  publish:
    name: Publish Release
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release branch matches Cargo.toml
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          test "release/v${{ steps.version.outputs.version }}" = "$RELEASE_BRANCH"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create and push tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Generate release notes
        run: git-cliff --current --strip header --output RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
