[package]
name = "copanion"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "A Rust CLI/TUI for attaching learning notes to source files and exporting structured follow-up questions for coding agents."
license = "MIT"
repository = "https://github.com/inmzhang/copanion"
homepage = "https://github.com/inmzhang/copanion"
readme = "README.md"
keywords = ["tui", "cli", "learning", "notes", "code"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", features = ["wayland-data-control"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
git2 = "0.20"
ignore = "0.4"
nucleo-matcher = "0.3.1"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = "5.3"
toml = "1.0"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
unicode-width = "0.2"
uuid = { version = "1.22", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27"
