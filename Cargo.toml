[package]
name = "copanion"
version = "0.1.0"
edition = "2024"
description = "A Rust CLI/TUI for attaching learning notes to source files and exporting structured follow-up questions for coding agents."
license = "MIT"
repository = "https://github.com/inm/copanion"
homepage = "https://github.com/inm/copanion"
readme = "README.md"
keywords = ["tui", "cli", "learning", "notes", "code"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", features = ["wayland-data-control"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
unicode-width = "0.2"
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.23"
